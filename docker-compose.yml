version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate:latest
    volumes:
      - ./migrations:/database/migrations
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["migrate"]
    command:
      - "-path=/database/migrations"
      - "-database=postgres://postgres:password@postgres:5432/subscriptions?sslmode=disable"
      - "up"

  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - migrate
    env_file: .env

volumes:
  postgres_data:
